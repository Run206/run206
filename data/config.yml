site:
  name: Run206
  domain: run206.com
  tagline: Every race, club run, and shakeout within 40 miles of Seattle.
  # Where the footer's "submit a run" link points. Set this to the repo's
  # issue-form URL once the repo exists:
  #   https://github.com/<you>/run206/issues/new?template=submit-event.yml
  submit_url: "https://github.com/Run206/run206/issues/new?template=submit-event.yml"
  description: >-
    A complete, automatically updated calendar of running races, club runs, and
    brand events across Seattle and the surrounding suburbs.

sources:
  runsignup:
    # zipcode + radius is the only geo filter that actually works on this API.
    # Passing latitude/longitude is silently ignored and returns nationwide results.
    zipcode: "98101"
    radius_miles: 40
    months_ahead: 14
    # Virtual races have no location to show up at, so they don't belong on a
    # local events calendar.
    exclude_virtual: true

  heylo:
    # Heylo groups whose public events should be pulled in. This is what
    # captures one-off club events — brand collabs, marathon festivals, socials
    # — that a weekly recurrence rule in clubs.yml can't express.
    #
    # `org` is the display name used on the site. `suppresses` should list the
    # club names in clubs.yml that this group posts for: when Heylo has a real
    # event on a given day, the generated weekly placeholder for those clubs is
    # dropped for that day, so the actual posted event wins.
    communities:
      - id: d1fdc906-b4d4-4ac4-9788-cd7b5df4b691
        org: Club Seattle Runners Division
        suppresses:
          - Club Seattle Runners Division

    # Events whose title or notes mention any of these are typed as brand
    # events rather than club runs. Leave unset to use the built-in list.
    brand_keywords: null

affiliate:
  # One entry per registration platform. Tokens are public tracking parameters,
  # not secrets — they ship in the page HTML either way.
  #
  # A link is only marked "affiliate" on the site when it actually carries a
  # tag, so disclosure never over-claims. Setting `enabled: false` leaves links
  # clean rather than appending a dead parameter.
  #
  # These are NOT raceRefCodes. A raceRefCode is a per-race referral reward tied
  # to one registrant account; it pays nothing on races whose director hasn't
  # enabled it, and it is stripped from every outbound link.
  platforms:
    # The parameter is `aflt_token`. Not `affiliateToken`, not `raceRefCode` —
    # both are silently ignored for affiliate credit, which is exactly how a
    # broken setup looks like a working one. Per RunSignUp's affiliate docs it
    # is credited on race, registration, donation and store pages.
    # Docs: https://runsignup.com/Affiliate/Doc
    - name: RunSignUp
      domain: runsignup.com
      param: aflt_token
      token: wc7B47h8BqW9drLnekNygSAMxqwhqsnt
      enabled: true
      signup: https://runsignup.com/affiliate
      dashboard: https://runsignup.com/Affiliate/745/Info

    # RaceRoster has no public affiliate programme as of August 2026. Their
    # robots.txt disallows `/*?aff=*`, which strongly implies an `aff` tracking
    # parameter exists internally — worth asking their partnerships team about,
    # but do not assume it pays anything. Left disabled deliberately.
    - name: Race Roster
      domain: raceroster.com
      param: aff
      token: ""
      enabled: false
      signup: ""

analytics:
  # Cloudflare Web Analytics. Free, unlimited, cookie-free — so no consent
  # banner is needed, unlike Google Analytics.
  #
  # This is the only thing that adds a third-party request to the page, which is
  # why it's off until you set a token. Get one at:
  #   Cloudflare dashboard -> Analytics & Logs -> Web Analytics -> Add a site
  # Paste the token from the data-cf-beacon snippet (just the token value).
  cloudflare_token: ""

newsletter:
  # Buttondown's free tier covers the first 100 subscribers and needs no
  # JavaScript — the form posts directly. Set your username to switch the
  # signup box on.
  buttondown_username: ""
  heading: The week ahead, by email
  blurb: >-
    One email on Thursday with everything worth running that weekend.
    No spam, unsubscribe in one click.
  note: Sent weekly. Your address is never shared.

build:
  # How far ahead to expand weekly club runs into concrete dates.
  club_weeks_ahead: 8
