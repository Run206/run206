site:
  name: Run206
  domain: run206.com
  tagline: Every race, club run, and shakeout within 40 miles of Seattle.
  description: >-
    A complete, automatically updated calendar of running races, club runs, and
    brand events across Seattle and the surrounding suburbs.

sources:
  runsignup:
    # zipcode + radius is the only geo filter that actually works on this API.
    # Passing latitude/longitude is silently ignored and returns nationwide results.
    zipcode: "98101"
    radius_miles: 40
    months_ahead: 14
    # Virtual races have no location to show up at, so they don't belong on a
    # local events calendar.
    exclude_virtual: true

  heylo:
    # Heylo groups whose public events should be pulled in. This is what
    # captures one-off club events — brand collabs, marathon festivals, socials
    # — that a weekly recurrence rule in clubs.yml can't express.
    #
    # `org` is the display name used on the site. `suppresses` should list the
    # club names in clubs.yml that this group posts for: when Heylo has a real
    # event on a given day, the generated weekly placeholder for those clubs is
    # dropped for that day, so the actual posted event wins.
    communities:
      - id: d1fdc906-b4d4-4ac4-9788-cd7b5df4b691
        org: Club Seattle Runners Division
        suppresses:
          - Club Seattle Runners Division

    # Events whose title or notes mention any of these are typed as brand
    # events rather than club runs. Leave unset to use the built-in list.
    brand_keywords: null

affiliate:
  # Get this from https://runsignup.com/affiliate — it is a public tracking
  # token, not a secret; it ships in the page HTML either way.
  #
  # NOTE: this is NOT the same as a raceRefCode. A raceRefCode is a per-race
  # referral reward tied to a registrant account and pays nothing on races whose
  # director hasn't enabled it. Leave this blank until the affiliate signup is
  # approved; the build will simply emit untagged links and warn.
  runsignup_token: ""

build:
  # How far ahead to expand weekly club runs into concrete dates.
  club_weeks_ahead: 8
