# Recurring club runs and brand events.
#
# Two kinds of entry:
#
#   cadence: weekly    + days: [monday] + time: "18:30"
#       -> the build expands this into real dates for the next 8 weeks, so the
#          run sorts and filters alongside races.
#
#   cadence: irregular + schedule: "Monthly - check Instagram"
#       -> no dates invented. Shown in the "Ongoing" group with its text as-is.
#          Use this whenever the real schedule can't be computed. Sending someone
#          to a run on a day it isn't happening is worse than showing no date.
#
# Times are 24h "HH:MM". Omit `time` if the club only says "evening"; put the
# vague wording in `time_text` instead.

- name: Monday Miles
  club: Club Seattle Runners Division
  type: Club Run
  cadence: weekly
  days: [monday]
  time: "18:30"
  location: MOHAI, under the canopy by the museum
  distances: 1-5 miles
  desc: All paces and all faces welcome. Seattle's largest independent run crew.
  url: https://www.heylo.com/g/d1fdc906-b4d4-4ac4-9788-cd7b5df4b691
  instagram: "@run_csrd"
  price: Free

