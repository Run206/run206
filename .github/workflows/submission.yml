name: Process event submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process:
    # Only issues created through the submission form.
    if: contains(github.event.issue.labels.*.name, 'event-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pyyaml

      - name: Write the issue body to a file
        # Via the environment, never interpolated into the shell — the body is
        # untrusted public input.
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/issue.md

      - name: Convert the submission to a clubs.yml entry
        id: convert
        run: |
          set +e
          OUTPUT=$(python3 scripts/submission.py \
            --body-file /tmp/issue.md --number "${{ github.event.issue.number }}" 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          {
            echo "result<<RUN206EOF"
            echo "$OUTPUT"
            echo "RUN206EOF"
          } >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Check the site still builds with the new entry
        if: steps.convert.outputs.code == '0'
        run: python3 scripts/build.py --offline && python3 scripts/verify.py

      - name: Open a pull request
        if: steps.convert.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="submission/${{ github.event.issue.number }}"
          git config user.name  "run206-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/clubs.yml
          git commit -m "Add event from #${{ github.event.issue.number }}"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --title "Add event from #${{ github.event.issue.number }}" \
            --body "Closes #${{ github.event.issue.number }}

          Generated from the submission form. Check the details against the
          submitter's link before merging — especially the day and time, since
          a wrong time sends people to an empty car park.

          \`\`\`
          ${{ steps.convert.outputs.result }}
          \`\`\`" \
            --head "$BRANCH"

      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.convert.outputs.code }}" = "0" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body \
              "Thanks. This has been turned into a pull request for review — it'll appear on the site once merged."
          else
            gh issue comment "${{ github.event.issue.number }}" --body \
              "Thanks for the submission. It needs a couple of fixes before it can be added:

          \`\`\`
          ${{ steps.convert.outputs.result }}
          \`\`\`

          Edit the issue to correct those and it'll be re-checked automatically."
          fi
