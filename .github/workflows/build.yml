name: Build and deploy

on:
  schedule:
    # 06:00 and 18:00 Pacific (13:00 / 01:00 UTC).
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let a scheduled run and a manual run publish at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Snapshot the last good data
        # verify.py compares against this to catch the API silently returning
        # an empty or truncated result set.
        run: |
          if [ -f public/events.json ]; then
            cp public/events.json /tmp/previous.json
          else
            echo '{"count":0,"events":[]}' > /tmp/previous.json
          fi

      - name: Build
        run: python3 scripts/build.py

      - name: Verify
        # A failure here leaves the previously deployed site untouched.
        run: python3 scripts/verify.py --baseline /tmp/previous.json

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "run206-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content change; skipping commit."
          else
            COUNT=$(python3 -c "import json;print(json.load(open('public/events.json'))['count'])")
            git commit -m "data: refresh events (${COUNT} total)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Report a failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The label must exist before --label will accept it.
          gh label create build-failure --color B60205 \
            --description "Scheduled data refresh failed" 2>/dev/null || true

          # Reuse a single open issue rather than filing a new one every 12h.
          EXISTING=$(gh issue list --label build-failure --state open \
            --json number --jq '.[0].number // empty')
          BODY="The scheduled build failed on $(date -u +%Y-%m-%dT%H:%MZ).

          The live site still shows the last good data — nothing was published.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Most likely causes: the RunSignUp API changed its response shape, or
          a hand-edited YAML file in data/ is malformed."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Scheduled build failed" \
              --label build-failure --body "$BODY"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
